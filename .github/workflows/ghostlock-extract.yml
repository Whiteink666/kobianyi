name: Build GhostLock extractor
on:
  workflow_call:
jobs:
  build:
    name: Build ghostlock-extract (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup rustup
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tools/extract_rs

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build extractor
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 35
        cargo build --target aarch64-linux-android --release \
          --manifest-path ./tools/extract_rs/Cargo.toml \
          --features http

    - name: Upload extractor artifact
      uses: actions/upload-artifact@v7
      with:
        name: ghostlock-extract-android-arm64
        path: target/aarch64-linux-android/release/ghostlock-extract
