android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
# 项目路径包含非 ASCII 字符（中文），跳过 AGP 路径检查
android.overridePathCheck=true
# 使用本地 JDK（D:\jdk-21.0.12.1+1），禁止 Gradle 自动联网下载 JDK
org.gradle.java.installations.auto-download=false
# 显式指定本地 JDK 21 路径供 toolchain 探测
org.gradle.java.installations.paths=D\:\\jdk-21.0.12.1+1
# 固定签名：内核只信任编译时写入的证书指纹，换 key 会导致 manager 不被识别
KEYSTORE_FILE=key.jks
KEYSTORE_PASSWORD=furryroot
KEY_ALIAS=furryroot
KEY_PASSWORD=furryroot
