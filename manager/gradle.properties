android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
# 项目路径包含非 ASCII 字符（中文），跳过 AGP 路径检查
android.overridePathCheck=true
# JDK 路径不写在这里：本地是 D:\jdk-21，CI 是 setup-java 装的路径，
# 写死会让其中一边找不到。两边各自用 JAVA_HOME 即可。
# 固定签名：内核只信任编译时写入的证书指纹，换 key 会导致 manager 不被识别
# （表现是临时 root 提示成功但拿不到 root）。
#
# 仓库里不保存正式版 keystore（见 .gitignore 的 Whiteink.jks / key.jks）：
# - 本地正式签名：把 Whiteink.jks 放到本目录，然后在
#   ~/.gradle/gradle.properties（不入库）里写上 KEYSTORE_FILE / *_PASSWORD / KEY_ALIAS
# - CI：配置仓库 secrets KEYSTORE(base64) / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#
# kernel/Kbuild 的 KSU_EXPECTED_SIZE/KSU_EXPECTED_HASH 默认就是 Whiteink 证书的指纹，
# 所以正式构建必须用那把 key，否则内核不会把本应用识别为 manager。
KEYSTORE_FILE=key.jks
KEYSTORE_PASSWORD=furryroot
KEY_ALIAS=furryroot
KEY_PASSWORD=furryroot
